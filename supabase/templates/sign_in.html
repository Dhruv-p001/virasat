<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f1e8;
      font-family: Georgia, serif;
      color: #24201b;
    "
  >
    <table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto">
      <tr>
        <td>
          <h1 style="font-size: 24px; margin: 0 0 16px">Sign in to Virasat</h1>
          <p
            style="
              font-family: Arial, sans-serif;
              font-size: 16px;
              line-height: 1.5;
              margin: 0 0 24px;
            "
          >
            Tap the button to sign in on this device.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
              style="
                display: inline-block;
                background: #8b4a2b;
                color: #fffcf6;
                font-family: Arial, sans-serif;
                font-size: 16px;
                font-weight: bold;
                text-decoration: none;
                padding: 14px 24px;
                border-radius: 999px;
              "
              >Sign in</a
            >
          </p>
          <p
            style="
              font-family: Arial, sans-serif;
              font-size: 16px;
              line-height: 1.5;
              margin: 0 0 8px;
            "
          >
            Signing in on another device? Enter this code there:
          </p>
          <p
            style="
              font-family: &quot;Courier New&quot;, monospace;
              font-size: 32px;
              letter-spacing: 6px;
              margin: 0 0 24px;
            "
          >
            {{ .Token }}
          </p>
          <p style="font-family: Arial, sans-serif; font-size: 14px; color: #665e55; margin: 0">
            If you didn't ask to sign in, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
